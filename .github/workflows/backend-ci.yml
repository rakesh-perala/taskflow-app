name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: taskflow/backend
  ROLE_ARN: arn:aws:iam::652310866649:role/taskflow-dev-github-actions-role

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Show GitHub Context
        run: |
          echo "repo=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "actor=${{ github.actor }}"
          echo "event=${{ github.event_name }}"

      - name: Decode OIDC JWT manually
        run: |
          set -x
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "raw_response=$RESP"
          TOKEN=$(echo "$RESP" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          echo "token_length=${#TOKEN}"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # Add padding if needed
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "decoded_payload=$(echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null)"

      - name: Try STS manually (no action)
        run: |
          set -x
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN=$(echo "$RESP" | sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "manual-test" \
            --web-identity-token "$TOKEN" \
            --region ap-south-1 || echo "MANUAL STS FAILED"
